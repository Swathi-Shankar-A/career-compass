<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>403 Access Forbidden - Career Recommendation System</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>

<header class="site-header">
    <div class="container nav-wrapper">
        <a href="../" class="brand-logo">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"></polygon>
            </svg>
            <span>CareerCompass <span class="brand-badge">CSE</span></span>
        </a>
        <nav>
            <ul class="nav-menu" id="siteNavMenu"></ul>
        </nav>
        <div class="nav-actions" id="siteNavActions"></div>
    </div>
</header>

<main class="main-content">
    <div class="container container-narrow" style="text-align: center; padding: 4rem 1rem;">
        <div style="width: 72px; height: 72px; border-radius: 50%; background: var(--danger-50); color: var(--danger-600); display: flex; align-items: center; justify-content: center; margin: 0 auto 1.5rem auto;">
            <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
        </div>

        <span class="badge badge-amber" style="margin-bottom: 0.5rem;">HTTP 403 Forbidden</span>
        <h1 style="font-size: 2.2rem; color: var(--navy-900); font-weight: 800; margin-bottom: 0.75rem;">
            Access Denied
        </h1>

        <p style="color: var(--slate-600); font-size: 1.05rem; max-width: 520px; margin: 0 auto 2rem auto; line-height: 1.6;">
            You do not have authorization to view this protected resource or another student's assessment report.
        </p>

        <div style="display: flex; gap: 1rem; justify-content: center;">
            <a href="../" class="btn btn-secondary">Go to Homepage</a>
            <a href="../login" class="btn btn-primary">Sign In</a>
        </div>
    </div>
</main>

<footer class="site-footer">
    <div class="container">
        <div class="footer-bottom">
            <div>&copy; <span id="currentYearSpan">2026</span> CareerCompass CSE. Academic Project for B.Tech CSE.</div>
        </div>
    </div>
</footer>

<script src="../assets/js/app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
    document.getElementById('currentYearSpan').textContent = new Date().getFullYear();
});
</script>
</body>
</html>
